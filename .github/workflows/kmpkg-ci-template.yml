  windows:
    if: ${{ inputs.enable-windows }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dump environment
        run: |
          Write-Host "=== Environment Dump ==="
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption) $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          $tools = @('cmake', 'ninja', 'git', 'python3', 'curl', 'tar')
          foreach ($tool in $tools) {
              $path = Get-Command $tool -ErrorAction SilentlyContinue
              if ($path) {
                  $ver = & $tool --version 2>&1 | Select-Object -First 1
                  Write-Host "  ${tool}: $($path.Source)  ($ver)"
              } else {
                  Write-Host "  ${tool}: NOT FOUND"
              }
          }
          $choco = Get-Command choco -ErrorAction SilentlyContinue
          if ($choco) {
              $ver = & choco --version 2>&1 | Select-Object -First 1
              Write-Host "  choco: $($choco.Source)  ($ver)"
          } else {
              Write-Host "  choco: NOT FOUND"
          }
          $compilers = @('cl', 'clang', 'g++')
          foreach ($cc in $compilers) {
              $path = Get-Command $cc -ErrorAction SilentlyContinue
              if ($path) {
                  $ver = & $cc --version 2>&1 | Select-Object -First 1
                  Write-Host "  ${cc}: $($path.Source)  ($ver)"
                  break
              }
          }
          Write-Host "=== End ==="
      - name: Install deps
        run: |
          choco install openssl strawberryperl ${{ inputs.deps-windows }} -y
      - name: Bootstrap kmpkg
        env:
          TEMP_DIR: ${{ runner.temp }}
          KMPKG_FORCE_SYSTEM_BINARIES: 1
        run: |
          $kmpkgRoot = Join-Path $env:TEMP_DIR "kmpkgcore"
          git clone https://github.com/kumose/kmpkgcore.git "$kmpkgRoot"
          python "$kmpkgRoot/kmpkgctl" bootstrap --disable-metrics
          echo "KMPKG_HOME=$kmpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$kmpkgRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "KMPKG_CMAKE=$kmpkgRoot/scripts/buildsystems/kmpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "KMPKG_FORCE_SYSTEM_BINARIES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "KMPKG_KEEP_ENV_VARS=PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: ${{ inputs.config-command }}
      - name: Build
        run: |
          if (-not (Get-Command nproc -ErrorAction SilentlyContinue)) {
            function global:nproc { [Environment]::ProcessorCount }
          }
          ${{ inputs.build-command }}
      - name: Test
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}
      - name: Benchmark
        if: ${{ inputs.benchmark-command != '' }}
        run: ${{ inputs.benchmark-command }}
      - name: Plot
        if: ${{ inputs.plot-command != '' }}
        run: ${{ inputs.plot-command }}
      - name: Upload benchmark results
        if: ${{ (inputs.benchmark-command != '' || inputs.plot-command != '') && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-benchmarks
          path: ${{ inputs.benchmark-artifact-path }}
          if-no-files-found: ignore
      - name: Publish benchmark results
        if: ${{ inputs.benchmark-publish-branch != '' && inputs.benchmark-publish-job == 'windows' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
