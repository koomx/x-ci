          echo "$kmpkgRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "KMPKG_CMAKE=$kmpkgRoot/scripts/buildsystems/kmpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "KMPKG_FORCE_SYSTEM_BINARIES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "KMPKG_KEEP_ENV_VARS=PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: ${{ inputs.config-command }}
      - name: Build
        run: |
          if (-not (Get-Command nproc -ErrorAction SilentlyContinue)) {
            function global:nproc { [Environment]::ProcessorCount }
          }
          ${{ inputs.build-command }}
      - name: Test
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}
      - name: Benchmark
        if: ${{ inputs.benchmark-command != '' }}
        run: ${{ inputs.benchmark-command }}
      - name: Plot
        if: ${{ inputs.plot-command != '' }}
        run: ${{ inputs.plot-command }}
      - name: Upload benchmark results
        if: ${{ (inputs.benchmark-command != '' || inputs.plot-command != '') && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-benchmarks
          path: ${{ inputs.benchmark-artifact-path }}
          if-no-files-found: ignore
      - name: Publish benchmark results
        if: ${{ inputs.benchmark-publish-branch != '' && inputs.benchmark-publish-job == 'windows-arm64' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          PUBLISH_BRANCH: ${{ inputs.benchmark-publish-branch }}
          SRC_DIR: ${{ inputs.benchmark-artifact-path }}
        run: |
          set -euo pipefail
          if [ ! -d "$SRC_DIR" ]; then
            echo "No benchmark results at $SRC_DIR; skip publish"
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$RUNNER_TEMP/bench-publish"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          if git fetch --depth 1 origin "$PUBLISH_BRANCH"; then
            git worktree add --force "$WORK" "origin/$PUBLISH_BRANCH"
          else
            git worktree add --force --detach "$WORK"
            (
              cd "$WORK"
              git checkout --orphan "$PUBLISH_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi
          rm -rf "$WORK/latest"
          mkdir -p "$WORK/latest"
          cp -a "$SRC_DIR"/. "$WORK/latest/"
          cd "$WORK"
          git add -A
          if git diff --cached --quiet; then
            echo "No benchmark publish changes"
            exit 0
          fi
          git commit -m "chore: update benchmark results"
          git push origin "HEAD:$PUBLISH_BRANCH"

      - name: Gather kmpkg logs
        if: failure()
        run: |
          $kmpkgRoot = $env:KMPKG_HOME
          if (-not $kmpkgRoot) { return }
          $logDir = Join-Path $env:RUNNER_TEMP "ci-logs"
          $null = New-Item -ItemType Directory -Path $logDir -Force
          $buildtrees = Join-Path $kmpkgRoot "buildtrees"
          if (Test-Path $buildtrees) {
            Get-ChildItem -Path $buildtrees -Recurse -Filter *.log | ForEach-Object {
              $rel = $_.FullName.Substring($kmpkgRoot.Length + 1)
              $dest = Join-Path $logDir $rel
              $null = New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force
              Copy-Item $_.FullName $dest
            }
          }
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/Temporary/
            ${{ runner.temp }}/ci-logs/
          if-no-files-found: ignore
