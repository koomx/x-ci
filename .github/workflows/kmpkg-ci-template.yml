name: x-ci-kmpkg

on:
  workflow_call:
    inputs:
      config-command:
        description: 'CMake configure command'
        required: true
        type: string
      build-command:
        description: 'Build command'
        required: true
        type: string
      test-command:
        description: 'Test command (optional)'
        required: false
        type: string
        default: ''
      benchmark-command:
        description: 'Benchmark command (optional; skipped if empty)'
        required: false
        type: string
        default: ''
      plot-command:
        description: 'Plot command after benchmark (optional; skipped if empty)'
        required: false
        type: string
        default: ''
      benchmark-artifact-path:
        description: 'Directory to upload / publish'
        required: false
        type: string
        default: 'benchmark-results/'
      benchmark-publish-branch:
        description: 'If set, publish results to this branch under latest/'
        required: false
        type: string
        default: ''
      benchmark-publish-job:
        description: 'Only this job id publishes to the branch'
        required: false
        type: string
        default: ''
      deps-ubuntu:
        description: 'Extra apt packages (Ubuntu/Debian)'
        required: false
        type: string
        default: ''
      deps-alpine:
        description: 'Extra apk packages (Alpine)'
        required: false
        type: string
        default: ''
      deps-centos:
        description: 'Extra yum/dnf packages (CentOS)'
        required: false
        type: string
        default: ''
      deps-macos:
        description: 'Extra brew packages'
        required: false
        type: string
        default: ''
      deps-windows:
        description: 'Extra choco packages'
        required: false
        type: string
        default: ''
      enable-std17-ubuntu20-amd64:
        description: 'Enable job std17-ubuntu20-amd64'
        required: false
        type: boolean
        default: false
      enable-std17-ubuntu20-arm64:
        description: 'Enable job std17-ubuntu20-arm64'
        required: false
        type: boolean
        default: false
      enable-std17-debian11-amd64:
        description: 'Enable job std17-debian11-amd64'
        required: false
        type: boolean
        default: false
      enable-std17-debian11-arm64:
        description: 'Enable job std17-debian11-arm64'
        required: false
        type: boolean
        default: false
      enable-std17-centos7-amd64:
        description: 'Enable job std17-centos7-amd64'
        required: false
        type: boolean
        default: false
      enable-std17-centos7-arm64:
        description: 'Enable job std17-centos7-arm64'
        required: false
        type: boolean
        default: false
      enable-std20-ubuntu22-amd64:
        description: 'Enable job std20-ubuntu22-amd64'
        required: false
        type: boolean
        default: false
      enable-std20-ubuntu22-arm64:
        description: 'Enable job std20-ubuntu22-arm64'
        required: false
        type: boolean
        default: false
      enable-std20-ubuntu24-amd64:
        description: 'Enable job std20-ubuntu24-amd64'
        required: false
        type: boolean
        default: false
      enable-std20-ubuntu24-arm64:
        description: 'Enable job std20-ubuntu24-arm64'
        required: false
        type: boolean
        default: false
      enable-std20-debian12-amd64:
        description: 'Enable job std20-debian12-amd64'
        required: false
        type: boolean
        default: false
      enable-std20-debian12-arm64:
        description: 'Enable job std20-debian12-arm64'
        required: false
        type: boolean
        default: false
      enable-std20-alpine319-amd64:
        description: 'Enable job std20-alpine319-amd64'
        required: false
        type: boolean
        default: false
      enable-std20-alpine319-arm64:
        description: 'Enable job std20-alpine319-arm64'
        required: false
        type: boolean
        default: false
      enable-std20-alpine320-amd64:
        description: 'Enable job std20-alpine320-amd64'
        required: false
        type: boolean
        default: false
      enable-std20-alpine320-arm64:
        description: 'Enable job std20-alpine320-arm64'
        required: false
        type: boolean
        default: false
      enable-std20-centos9-amd64:
        description: 'Enable job std20-centos9-amd64'
        required: false
        type: boolean
        default: false
      enable-std20-centos9-arm64:
        description: 'Enable job std20-centos9-arm64'
        required: false
        type: boolean
        default: false
      enable-macos-arm64:
        description: 'Enable macos-arm64 job'
        required: false
        type: boolean
        default: false
      enable-macos-x86:
        description: 'Enable macos-x86 job'
        required: false
        type: boolean
        default: false
      enable-windows:
        description: 'Enable windows job'
        required: false
        type: boolean
        default: false
      enable-windows-arm64:
        description: 'Enable windows-arm64 job'
        required: false
        type: boolean
        default: false

jobs:

  std17-ubuntu20-amd64:
    if: ${{ inputs.enable-std17-ubuntu20-amd64 }}
    runs-on: ubuntu-latest
    container: ghcr.io/koomx/kumo-std17-ubuntu20-amd64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump environment
        run: |
          echo "=== Environment Dump ==="
          if [ -f /etc/os-release ]; then
              . /etc/os-release
              echo "OS: $NAME $VERSION ($(uname -m))"
          elif [ "$(uname)" = "Darwin" ]; then
              echo "OS: macOS $(sw_vers -productVersion 2>/dev/null || echo unknown) ($(uname -m))"
          else
              echo "OS: $(uname -a 2>/dev/null || echo unknown)"
          fi
          for tool in cmake ninja make git python3 curl tar gzip; do
              if command -v $tool &>/dev/null; then
                  echo "  $tool: $(command -v $tool)  ($($tool --version 2>&1 | head -1))"
              else
                  echo "  $tool: NOT FOUND"
              fi
          done
          if [ "$(uname)" = "Darwin" ]; then
              echo "  sw_vers: $(sw_vers -productVersion 2>/dev/null || echo unknown)"
              for tool in xcodebuild autoconf automake libtool pkg-config; do
                  if command -v $tool &>/dev/null; then
                      echo "  $tool: $(command -v $tool)  ($($tool --version 2>&1 | head -1))"
                  else
                      echo "  $tool: NOT FOUND"
                  fi
              done
          fi
          for cc in gcc g++ clang clang++ cc c++; do
              if command -v $cc &>/dev/null; then
                  echo "  $($cc --version 2>&1 | head -1)"
                  break
              fi
          done
          echo "=== End ==="
      - name: Install deps
        run: |
          if [ -n "${{ inputs.deps-ubuntu }}" ]; then
            apt-get update -qq
            apt-get install -y -qq ${{ inputs.deps-ubuntu }}
          fi
      - name: Bootstrap kmpkg
        run: |
          git clone --depth 1 https://github.com/kumose/kmpkgcore.git /tmp/kmpkgcore
          /tmp/kmpkgcore/kmpkgctl bootstrap --disable-metrics
          echo "KMPKG_HOME=/tmp/kmpkgcore" >> $GITHUB_ENV
          echo "KMPKG_CMAKE=/tmp/kmpkgcore/scripts/buildsystems/kmpkg.cmake" >> $GITHUB_ENV
          echo "KMPKG_FORCE_SYSTEM_BINARIES=1" >> $GITHUB_ENV
      - name: Configure
        run: ${{ inputs.config-command }}
      - name: Build
        run: ${{ inputs.build-command }}
      - name: Test
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}
      - name: Benchmark
        if: ${{ inputs.benchmark-command != '' }}
        run: ${{ inputs.benchmark-command }}
      - name: Plot
        if: ${{ inputs.plot-command != '' }}
        run: ${{ inputs.plot-command }}
      - name: Upload benchmark results
        if: ${{ (inputs.benchmark-command != '' || inputs.plot-command != '') && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: std17-ubuntu20-amd64-benchmarks
          path: ${{ inputs.benchmark-artifact-path }}
          if-no-files-found: ignore
      - name: Publish benchmark results
        if: ${{ inputs.benchmark-publish-branch != '' && inputs.benchmark-publish-job == 'std17-ubuntu20-amd64' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          PUBLISH_BRANCH: ${{ inputs.benchmark-publish-branch }}
          SRC_DIR: ${{ inputs.benchmark-artifact-path }}
        run: |
          set -euo pipefail
          if [ ! -d "$SRC_DIR" ]; then
            echo "No benchmark results at $SRC_DIR; skip publish"
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$RUNNER_TEMP/bench-publish"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          if git fetch --depth 1 origin "$PUBLISH_BRANCH"; then
            git worktree add --force "$WORK" "origin/$PUBLISH_BRANCH"
          else
            git worktree add --force --detach "$WORK"
            (
              cd "$WORK"
              git checkout --orphan "$PUBLISH_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi
          rm -rf "$WORK/latest"
          mkdir -p "$WORK/latest"
          cp -a "$SRC_DIR"/. "$WORK/latest/"
          cd "$WORK"
          git add -A
          if git diff --cached --quiet; then
            echo "No benchmark publish changes"
            exit 0
          fi
          git commit -m "chore: update benchmark results"
          git push origin "HEAD:$PUBLISH_BRANCH"

      - name: Gather kmpkg logs
        if: failure()
        run: |
          mkdir -p build/kmpkg-logs
          if [ -d /tmp/kmpkgcore/buildtrees ]; then
            find /tmp/kmpkgcore/buildtrees -name "*.log" | while IFS= read -r f; do
              rel="${f#/tmp/kmpkgcore/}"
              mkdir -p "build/kmpkg-logs/$(dirname "$rel")"
              cp "$f" "build/kmpkg-logs/$rel"
            done
          fi
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: std17-ubuntu20-amd64-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/Temporary/
            build/kmpkg-logs/
          if-no-files-found: ignore

