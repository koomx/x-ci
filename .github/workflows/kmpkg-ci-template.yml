        if: failure()
        run: |
          mkdir -p build/kmpkg-logs
          if [ -d /tmp/kmpkgcore/buildtrees ]; then
            find /tmp/kmpkgcore/buildtrees -name "*.log" | while IFS= read -r f; do
              rel="${f#/tmp/kmpkgcore/}"
              mkdir -p "build/kmpkg-logs/$(dirname "$rel")"
              cp "$f" "build/kmpkg-logs/$rel"
            done
          fi
