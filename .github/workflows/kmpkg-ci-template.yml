        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: std20-centos9-arm64-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/Temporary/
            build/kmpkg-logs/
          if-no-files-found: ignore

