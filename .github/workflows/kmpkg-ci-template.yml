      - name: Publish benchmark results
        if: ${{ inputs.benchmark-publish-branch != '' && inputs.benchmark-publish-job == 'std20-centos9-arm64' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          PUBLISH_BRANCH: ${{ inputs.benchmark-publish-branch }}
          SRC_DIR: ${{ inputs.benchmark-artifact-path }}
        run: |
          set -euo pipefail
          if [ ! -d "$SRC_DIR" ]; then
            echo "No benchmark results at $SRC_DIR; skip publish"
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$RUNNER_TEMP/bench-publish"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          if git fetch --depth 1 origin "$PUBLISH_BRANCH"; then
            git worktree add --force "$WORK" "origin/$PUBLISH_BRANCH"
          else
            git worktree add --force --detach "$WORK"
            (
              cd "$WORK"
              git checkout --orphan "$PUBLISH_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi
          rm -rf "$WORK/latest"
          mkdir -p "$WORK/latest"
          cp -a "$SRC_DIR"/. "$WORK/latest/"
          cd "$WORK"
          git add -A
          if git diff --cached --quiet; then
            echo "No benchmark publish changes"
            exit 0
          fi
          git commit -m "chore: update benchmark results"
          git push origin "HEAD:$PUBLISH_BRANCH"

