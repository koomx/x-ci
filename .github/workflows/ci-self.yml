name: x-ci Self Test

on:
  push:
    branches: [dev, v1-dev, main]
  pull_request:
    branches: [dev, v1-dev, main]
  workflow_dispatch:

jobs:
  self:
    permissions:
      contents: write
    uses: ./.github/workflows/vcpkg-template.yml
    with:
      enable-std20-ubuntu24-amd64: true
      config-command: |
        cmake -S test -B build -G Ninja
      build-command: |
        cmake --build build
      test-command: |
        ctest --test-dir build --output-on-failure -j1
      benchmark-command: |
        python3 scripts/bench_demo.py
      plot-command: |
        python3 scripts/plot_demo.py
      benchmark-publish-branch: benchmark-results
      benchmark-publish-job: std20-ubuntu24-amd64
